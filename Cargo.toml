[workspace]
members = ["crates/core", "crates/ayu", "crates/ayu-ffi", "tools/uniffi-bindgen"]
exclude = [
    "native/telegram-macos/submodules/tlottie",
    "native/telegram-macos/submodules/telegram-ios/third-party/wallet-engine/wallet-engine/xtask",
    "native/telegram-macos/submodules/telegram-ios/third-party/wallet-engine/wallet-engine/bindgen/apple",
]
default-members = ["crates/ayu-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
slopogram-core = { path = "crates/core" }
fs2 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tempfile = "3"
uniffi = "0.32.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

